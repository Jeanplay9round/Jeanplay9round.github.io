<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>플그 재고알림 - Cafe24 인증</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#222}code{display:block;word-break:break-all;background:#f4f1ea;padding:12px;border-radius:8px}button{margin-top:12px;padding:8px 16px;border:0;border-radius:8px;background:#ff5b2e;color:#fff;font-weight:600;cursor:pointer}</style></head>
<body><h1>플그 재고알림</h1>
<p id="m">Cafe24 인증을 마치면 이 페이지로 돌아와요. 이 페이지는 아무 데도 데이터를 보내지 않아요.</p>
<code id="u"></code><button id="b" hidden>주소 복사</button>
<script>
const has=new URLSearchParams(location.search).has("code");
document.getElementById("u").textContent=has?location.href:"";
if(has){document.getElementById("m").textContent="인증 코드가 왔어요. 아래 주소 전체를 1분 안에 GitHub 이슈 댓글로 남겨 주세요.";const b=document.getElementById("b");b.hidden=false;b.onclick=()=>navigator.clipboard.writeText(location.href).then(()=>b.textContent="복사됨");}
</script></body></html>
